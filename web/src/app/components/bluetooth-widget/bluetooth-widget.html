@let bluetooth = system.bluetooth();

<mat-card class="bluetooth-widget widget">
    <mat-card-header>
        <mat-card-title><mat-icon class="title-icon">bluetooth</mat-icon>Bluetooth</mat-card-title>
    </mat-card-header>
    <mat-card-content class="scroll-list">
        @for (device of bluetooth!.devices; track device.macDevice) {
        <div class="item-card">
            <div class="stat-grid">
                <div class="stat stat--sm">
                    <span class="label">Name</span>
                    <span class="value">{{ device.name }}</span>
                </div>
                <div class="stat stat--sm">
                    <span class="label">Type</span>
                    <span class="value">{{ device.type }}</span>
                </div>
                <div class="stat stat--sm">
                    <span class="label">Connected</span>
                    <span class="value">{{ device.connected ? 'Yes' : 'No' }}</span>
                </div>
                @if (device.batteryPercent !== null) {
                <div class="stat stat--sm">
                    <span class="label">Battery</span>
                    <span class="value">{{ device.batteryPercent }}%</span>
                </div>
                }
            </div>
        </div>
        }
    </mat-card-content>
</mat-card>
